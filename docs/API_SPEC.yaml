openapi: 3.1.0
info:
  title: AI Seller Ecosystem API
  version: 0.1.0
  description: Initial API contract. Organization identity endpoints are implemented; other business endpoints are planned.
servers:
  - url: https://api.example.invalid/api/v1
paths:
  /health:
    get:
      summary: Service health
      responses:
        "200":
          description: Healthy
  /organizations:
    get:
      summary: List organizations for authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Organization memberships
    post:
      summary: Create organization; authenticated user becomes owner
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$", minLength: 3, maxLength: 48 }
      responses:
        "201": { description: Organization created }
        "401": { description: Missing or invalid OIDC access token }
        "409": { description: Organization slug already exists }
  /agents:
    get:
      summary: List agents in active organization
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Agent list }
    post:
      summary: Create agent draft
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Draft created }
  /agents/{agentId}/runs:
    post:
      summary: Start an agent run
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: agentId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 12, maxLength: 128 }
      responses:
        "202": { description: Run accepted }
  /integrations/telegram:
    post:
      summary: Register Telegram bot integration
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Integration registered }
  /webhooks/telegram/{integrationId}:
    post:
      summary: Receive Telegram Bot API update
      parameters:
        - in: path
          name: integrationId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-Telegram-Bot-Api-Secret-Token
          required: true
          schema: { type: string }
      responses:
        "200": { description: Accepted or duplicate ignored }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
