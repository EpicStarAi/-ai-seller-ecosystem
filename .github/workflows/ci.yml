name: CI
on:
  push:
    branches: [main, feature/identity-tenancy, feature/web-workspace]
    paths:
      - "apps/api/**"
      - "infra/postgres/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, feature/identity-tenancy]
    paths:
      - "apps/api/**"
      - "infra/postgres/**"
      - ".github/workflows/ci.yml"
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_seller
      TEST_DATABASE_ADMIN_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ai_seller
      TEST_DATABASE_URL: postgresql+psycopg://app_runtime:change-me-local-only@localhost:5432/ai_seller
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ai_seller
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_seller"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Apply PostgreSQL migrations
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          for migration in infra/postgres/migrations/*.sql; do
            psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - run: ruff check .
      - run: pytest -q
